<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Methode">
<meta name="theme-color" content="#0f1116">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Die Methode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0f1116; --card:#181b22; --card2:#232833; --ink:#f4f5f8; --muted:#9aa1b0; --line:#2b313d;
  --mint:#8fe6d0; --mint2:#b7f1e2; --lav:#bcaaff; --lav2:#d7ccff;
  --accent:var(--mint); --accent-dark:#0f1116; --accent-soft:rgba(143,230,208,.14);
  --ok:#8ff0a0; --ok-soft:rgba(143,240,160,.14); --warn:#ffd36a; --warn-soft:rgba(255,211,106,.13);
  --blue:var(--lav); --blue-soft:rgba(188,170,255,.16); --danger:#ff7b72;
  --grad:linear-gradient(135deg,#a9f0dc 0%,#c7b8ff 100%);
  --head:"Oswald","Arial Narrow",-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0;height:100%}
body{color:var(--ink);font:17px/1.45 var(--body);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3{margin:0;font-family:var(--head);text-wrap:balance}
h2{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
a{color:var(--lav)}
.top{position:sticky;top:0;z-index:20;background:rgba(15,17,22,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 24px/1 var(--head);letter-spacing:.06em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font:600 11px/1.2 var(--body);letter-spacing:.14em;color:var(--muted);margin-top:4px;-webkit-text-fill-color:var(--muted)}
.profiles{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.profiles::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;min-width:0}
.card.soft{background:var(--accent-soft);border-color:rgba(143,230,208,.35)}
.card.warn{background:var(--warn-soft);border-color:rgba(255,211,106,.35)}
.card.ok{background:var(--ok-soft);border-color:rgba(143,240,160,.35)}
.card.blue{background:var(--blue-soft);border-color:rgba(188,170,255,.4)}
.card.hero{background:var(--grad);color:#0f1116;border:0;box-shadow:0 10px 30px rgba(143,230,208,.15)}
.hero .sub,.hero .hint{color:rgba(15,17,22,.72)}
.hero a{color:#0f1116;font-weight:700}
.hero .pill,.hero .pill.red,.hero .pill.blue,.hero .pill.green{background:rgba(15,17,22,.14);color:#0f1116}
.hero .ci{background:rgba(15,17,22,.14);color:#0f1116}
.herorow{display:flex;align-items:center;gap:12px}
.herorow .dayhead{flex:1;min-width:0}
.ring{flex:0 0 auto;width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:rgba(15,17,22,.14)}
.ring .pr{stroke:#0f1116;transition:stroke-dashoffset .4s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 20px/1 var(--head);font-variant-numeric:tabular-nums}
.ring small{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(15,17,22,.7)}
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead .big{font:700 30px/1 var(--head);text-transform:uppercase;letter-spacing:.02em}
.dayhead .sub{font-size:15px;margin-top:4px}
.dayhead .em{font-size:34px;line-height:1}
.week{display:grid;grid-template-columns:34px repeat(7,1fr) 34px;gap:3px;align-items:center;margin:4px 0 12px}
.day{border:0;background:transparent;border-radius:14px;padding:7px 0 6px;text-align:center;font-size:12px;color:var(--muted);line-height:1.1}
.day b{display:block;font:600 18px/1.2 var(--head);color:var(--ink)}
.day.sel{background:var(--mint);color:#0f1116}
.day.sel b{color:#0f1116}
.day.today{box-shadow:inset 0 0 0 2px var(--mint)}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--lav);margin:3px auto 0;opacity:0}
.day .dot.on{opacity:1}
.day.sel .dot.on{background:#0f1116}
.arrow{border:0;background:transparent;font-size:26px;color:var(--muted);padding:4px 0}
.bh{display:flex;gap:12px;align-items:flex-start}
.be{font-size:28px;line-height:1.1;flex:0 0 auto}
.bt{font:600 21px/1.2 var(--head)}
.bs{color:var(--muted);font-size:15px;margin-top:3px}
.bx{color:var(--muted);font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.rx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rx div{background:var(--card2);border-radius:18px;padding:12px 8px;text-align:center;min-width:0}
.rx b{display:block;font:700 42px/1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--lav2)}
.rx .main{background:var(--grad)}
.rx .main b{color:#0f1116}
.rx .main span{color:rgba(15,17,22,.72)}
.rx .tap{cursor:pointer}
.rx .tap:active{transform:scale(.98)}
.rx span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.2}
.line{font-size:15px;color:var(--ink);margin-top:12px;font-weight:600}
.tip{margin-top:8px;border:0;padding:0;background:transparent}
.tip summary{padding:6px 0;font-size:14px;color:var(--muted);font-weight:600}
.tip summary::after{content:""}
.tip .dbody{font-size:14px;color:var(--muted);padding:0 0 4px}
.counter{display:flex;align-items:center;gap:10px;margin-top:14px}
.rbtn{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:28px;line-height:1;flex:0 0 auto}
.rbtn:disabled{opacity:.35}
.cnum{font:700 38px/1 var(--head);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.cnum small{display:block;font:600 13px/1 var(--body);color:var(--muted);margin-top:5px}
.btn{min-height:48px;border-radius:14px;font-size:17px;font-weight:600;padding:0 16px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
.btn.primary{background:var(--mint);color:#0f1116;border-color:var(--mint)}
.btn.ok{background:var(--ok);color:#0f1116;border-color:var(--ok)}
.btn.blue{background:var(--lav);color:#0f1116;border-color:var(--lav)}
.btn.danger{color:var(--danger);border-color:rgba(255,123,114,.4);background:transparent}
.btn.danger.sure{background:var(--danger);color:#0f1116;border-color:var(--danger)}
.btn.big{width:100%;min-height:54px}
.btn.grow{flex:1}
.btn.sm{min-height:38px;font-size:15px;padding:0 12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--lav);transition:width .2s}
.bar i.ok{background:var(--mint)}
.field{margin-bottom:14px;min-width:0}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;padding:12px;font-size:17px;min-height:48px}
.field textarea{min-height:80px;resize:vertical}
.field input[type=checkbox]{width:24px;height:24px;min-height:0;vertical-align:middle;margin-right:8px;accent-color:var(--mint)}
.field.inline label{display:inline;text-transform:none;letter-spacing:0;font-size:16px;font-weight:600;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sel{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:16px;min-height:46px;margin-top:12px}
.timer{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--card2);border-radius:18px;padding:10px 12px}
.tdisp{font:700 40px/1 var(--head);font-variant-numeric:tabular-nums;min-width:110px}
.tdisp.done{color:var(--mint)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.list .item:first-child{border-top:0}
.item .ie{font-size:24px;flex:0 0 32px;text-align:center}
.item .it{flex:1;min-width:0}
.item .it b{display:block;font-weight:600}
.item .it span{color:var(--muted);font-size:14px}
.item .iv{font:700 22px/1 var(--head);font-variant-numeric:tabular-nums;text-align:right;flex:0 0 auto;color:var(--mint2)}
.item .iv small{display:block;font:600 12px/1 var(--body);color:var(--muted);margin-top:4px}
.datehead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px}
.datehead b{font:600 17px/1.2 var(--head);text-transform:uppercase;letter-spacing:.04em}
.datehead span{color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--card2);color:var(--muted)}
.pill.red{background:var(--accent-soft);color:var(--mint)}
.pill.green{background:var(--ok-soft);color:var(--ok)}
.pill.blue{background:var(--blue-soft);color:var(--lav2)}
.hint{color:var(--muted);font-size:14px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .k{border-radius:20px;padding:14px;background:var(--card);border:1px solid var(--line)}
.kpi .k b{display:block;font:700 30px/1 var(--head);font-variant-numeric:tabular-nums}
.kpi .k span{font-size:13px;color:var(--muted)}
.kpi .k.k1{background:var(--grad);border:0;color:#0f1116}.kpi .k.k1 span{color:rgba(15,17,22,.72)}
.kpi .k.k2{background:var(--lav);border:0;color:#0f1116}.kpi .k.k2 span{color:rgba(15,17,22,.72)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.num,th.num{text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:rgba(21,24,31,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 env(safe-area-inset-bottom,0px);z-index:30}
.tab{flex:1;border:0;background:transparent;padding:6px 0 7px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);line-height:1.1}
.tab i{display:block;font-style:normal;font-size:24px;margin-bottom:3px}
.tab.on{color:var(--mint)}
.tab-plus{flex:0 0 76px;padding:0 0 8px}
.tab-plus i{width:58px;height:58px;margin:-26px auto 0;border-radius:50%;background:var(--grad);color:#0f1116;font-size:34px;line-height:58px;box-shadow:0 8px 24px rgba(143,230,208,.35);font-weight:700}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h3{font-size:22px;font-weight:600}
.mfoot{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:#0f1116;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:700;z-index:60;max-width:90%;text-align:center}
details{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:0 14px;margin-bottom:12px}
details summary{padding:12px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"＋";color:var(--muted)}
details[open] summary::after{content:"－"}
details .dbody{padding:0 0 12px;color:var(--muted);font-size:15px}
details .dbody p{margin:0 0 8px}
.ladder{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ladder span{background:var(--card2);border-radius:10px;padding:6px 10px;font:600 15px/1 var(--head)}
.ladder span.top{background:var(--accent-soft);color:var(--mint)}
.pick{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.pick .pk-name{display:block;font-weight:600;line-height:1.2}
.pick small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.pick i{margin-left:auto;font-style:normal;color:var(--muted)}
.pick.sel{min-height:54px;padding:8px 12px}
.picker{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pk-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px}
.pk-head b{font:600 22px/1.2 var(--head)}
.pk-chips{padding:6px 16px 8px}
.pk-q{margin:0 16px 8px;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:17px;background:var(--card2);color:var(--ink);-webkit-appearance:none}
.pk-list{flex:1;overflow-y:auto;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.pk-item{display:flex;align-items:center;gap:8px;width:100%;border-bottom:1px solid var(--line);background:var(--card);padding:0 8px 0 0}
.pk-item.on{background:var(--accent-soft)}
.pk-main{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:12px 16px;color:var(--ink)}
.pk-main b{display:block;font-weight:600}
.pk-main span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pk-yt{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;background:var(--card2)}
.np{display:flex;align-items:center;gap:8px}
.np-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:26px;line-height:1;flex:0 0 auto}
.np-strip{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.np-strip::-webkit-scrollbar{display:none}
.np-track{display:flex;padding:0 calc(50% - 28px)}
.np-cell{flex:0 0 56px;height:58px;display:flex;align-items:center;justify-content:center;font:600 20px/1 var(--head);color:var(--muted);border-radius:14px;border:0;background:transparent;padding:0}
.np-cell.on{color:#0f1116;font-size:34px;background:var(--mint)}
.np-hint{font-size:13px;color:var(--muted);margin-top:4px}
.kinds{padding:0 0 4px}
.kinds .chip{font-size:15px;padding:9px 13px}
.kinds .chip.on{background:var(--mint);border-color:var(--mint);color:#0f1116}
.demo{margin-top:8px}
.demo .btn{text-decoration:none;display:inline-flex;align-items:center}
.ci{border:0;background:var(--blue-soft);color:var(--lav2);border-radius:50%;width:28px;height:28px;font:700 15px/28px var(--body);display:inline-flex;align-items:center;justify-content:center;padding:0;margin-left:6px;vertical-align:middle;cursor:pointer;flex:0 0 auto;font-style:normal}
.bh .ci{margin-left:auto}
.chip .ci{width:22px;height:22px;font-size:13px;line-height:22px;margin-left:4px}
.chip.on .ci{background:rgba(15,17,22,.15);color:#0f1116}
.kinfo{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.45}
.info-body{flex:1;overflow-y:auto;padding:4px 16px 24px;font-size:16px;line-height:1.5;background:var(--card);border-top:1px solid var(--line)}
.info-body p{margin:0 0 12px}
.info-kurz{font-weight:600;color:var(--ink);padding:10px 16px 12px}
.intro-head{background:var(--grad);color:#0f1116;padding:12px 16px 18px}
.intro-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.intro-head .btn{background:rgba(15,17,22,.12);border-color:transparent;color:#0f1116}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(15,17,22,.25);transition:width .2s}
.dots i.on{background:#0f1116;width:24px}
.intro-e{font-size:40px;line-height:1}
.intro-t{font:700 30px/1.1 var(--head);text-transform:uppercase;letter-spacing:.02em;margin-top:8px}
.intro-body{flex:1;overflow-y:auto;padding:16px 16px 24px;font-size:17px;line-height:1.55;background:var(--bg)}
.intro-body p{margin:0 0 12px}
.intro-body h4{font:600 18px/1.2 var(--head);margin:16px 0 6px;color:var(--mint);letter-spacing:.03em;text-transform:uppercase}
.intro-body h4:first-child{margin-top:0}
.intro-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="topline">
    <div class="brand">Die Methode<small>6 Bausteine · Körpergewicht</small></div>
    <button class="btn sm" data-act="home">Heute</button>
  </div>
  <div class="profiles" id="profiles"></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button class="tab" data-act="go" data-view="heute"><i>📅</i>Heute</button>
  <button class="tab" data-act="go" data-view="verlauf"><i>📈</i>Verlauf</button>
  <button class="tab tab-plus" data-act="newEntry" data-nav="1" aria-label="Neuer Eintrag"><i>＋</i></button>
  <button class="tab" data-act="go" data-view="tests"><i>🧪</i>Tests</button>
  <button class="tab" data-act="go" data-view="einstellungen"><i>⚙️</i>Einstellungen</button>
</nav>
<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mhead"><h3 id="m-title"></h3><button class="btn sm" data-act="mClose">Schließen</button></div>
    <div id="m-body"></div>
    <div class="mfoot" id="m-foot"></div>
  </div>
</div>
<div class="picker" id="picker" hidden>
  <div class="pk-head"><div><b id="pk-title">Übung wählen</b><div class="hint" id="pk-count"></div></div><button class="btn sm" data-act="pkClose">Schließen</button></div>
  <div class="profiles pk-chips" id="pk-chips"></div>
  <input type="search" id="pk-q" class="pk-q" placeholder="🔍 Übung suchen …" autocomplete="off" data-inp="pkQ">
  <div class="pk-list" id="pk-list"></div>
</div>
<div class="picker" id="intro" hidden>

<script>
(function(){
'use strict';
/* ---------- Grundlagen ---------- */
const KEY='methode.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function fromISO(s){const p=String(s||'').split('-').map(Number);return new Date(p[0]||2000,(p[1]||1)-1,p[2]||1);}
const todayISO=()=>toISO(new Date());
function addDays(iso,n){const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);}
const fmtDate=iso=>{const d=fromISO(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};
const fmtShort=iso=>{const d=fromISO(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';};
const daysBetween=(a,b)=>Math.round((fromISO(b)-fromISO(a))/86400000);
function mondayOf(iso){const d=fromISO(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return toISO(d);}
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const DAY={1:'schwer',4:'schwer',2:'mittel',5:'mittel',3:'leicht',6:'leicht',0:'ruhe'};
const DAYINFO={
  schwer:{e:'🔥',n:'Schwerer Tag',t:'Erst die Schockmethode, dann Leitern für Drücken und Ziehen, zum Schluss die Beine. Dazu über den Tag die verteilten Sätze.'},
  mittel:{e:'⏱️',n:'Mittlerer Tag',t:'Ein Dichteblock: 15 Minuten, so viele saubere Sätze wie möglich. Dazu über den Tag die verteilten Sätze.'},
  leicht:{e:'🌤️',n:'Leichter Tag',t:'Nur die verteilten Sätze über den Tag. Kein Satz ist ein Kampf.'},

};
const KIND={
  gtg:{e:'🔁',n:'Verteilte Sätze',u:'Sätze'},
  leiter:{e:'🪜',n:'Leitern',u:'Leitern'},
  dichte:{e:'⏱️',n:'Dichteblock',u:'Sätze'},

};
const SLOT={push:'Drücken',pull:'Ziehen',legs:'Beine',schock:'Schockmethode'};
const INTRO=[
 {e:'👋',t:'Willkommen bei der Methode',h:`<p>Diese App begleitet dich durch ein Krafttraining, das fast jede Regel bricht, die man dir je beigebracht hat: dieselbe Bewegung fast jeden Tag, kleine Sätze über den ganzen Tag verteilt, und fast nie bis zur Erschöpfung.</p><p>Genau deshalb funktioniert es. Ein Anfänger sammelt damit in wenigen Wochen ein Trainingsvolumen, für das die meisten Leute Monate brauchen. Die sowjetischen Trainer haben so ihre stärksten Männer aufgebaut.</p><p>Du brauchst kein Studio, keine Geräte und keinen 20-seitigen Plan. Nur dein Körpergewicht, einen Stuhl, einen Tisch und ein paar Minuten, mehrmals am Tag.</p><p><b>Die App sagt dir jeden Tag, was dran ist.</b> Du musst nur tippen, wenn du einen Satz gemacht hast. Alles andere rechnet sie für dich aus.</p><p class="hint">Lesezeit für diese Einführung: etwa 5 Minuten. Du findest sie jederzeit wieder in den Einstellungen.</p>`},
 {e:'💪',t:'Was du davon hast',h:`<h4>Nacken und Schultern</h4><p>Wer viel sitzt, fährt oder aufs Handy schaut, zieht die Schultern nach vorn und den Kopf nach unten. Die Muskeln zwischen den Schulterblättern werden lang und schwach, der Nacken hält den ganzen Tag dagegen und verspannt. Rudern, Klimmzüge und Leitern kräftigen genau diese Muskeln. Der Oberkörper richtet sich auf, der Kopf sitzt wieder über den Schultern, und die Dauerspannung im Nacken lässt nach. Viele merken das als Erstes, oft schon nach wenigen Wochen.</p><h4>Rücken</h4><p>Ein kräftiger Rumpf stützt die Wirbelsäule wie ein Korsett. Hüftheben, Split Squats und Stützübungen nehmen dem unteren Rücken Arbeit ab, die er sonst allein tragen muss.</p><h4>Alltag</h4><p>Treppen, Kisten, Kinder tragen, lange Tage auf den Beinen: Mit mehr Kraft wird alles leichter, und die Gelenke werden geschont, weil Muskeln die Stöße abfangen.</p><h4>Figur und Stoffwechsel</h4><p>Muskeln verbrauchen Energie, auch in Ruhe. Zusammen mit vernünftigem Essen hilft das beim Abnehmen. Und wenn Schultern, Brust und Rücken stärker werden, hört dein Körper auf, nach vorn einzusinken. Du stehst von selbst offener und fester. Deine Silhouette verändert sich, noch bevor der Spiegel es mitbekommt.</p><h4>Kopf</h4><p>Kleine Sätze, die du immer schaffst, bauen etwas auf, das größer ist als Muskeln: das Gefühl, dass du dich auf dich verlassen kannst.</p><p class="hint">Bei akuten Schmerzen, Bandscheibenproblemen oder nach Verletzungen vorher mit Arzt oder Physiotherapeut sprechen. Die Methode ist sanft, aber kein Ersatz für Behandlung.</p>`},
 {e:'🧱',t:'Die sechs Bausteine',h:`<p>Die Methode besteht aus sechs Bausteinen. Alle funktionieren zu Hause, nur mit deinem Körpergewicht.</p><p><b>🔁 1 · Verteilte Sätze.</b> Du machst einmal so viele saubere Wiederholungen wie möglich. Die Hälfte davon ist deine Satzgröße. Die machst du 5 bis 8 Mal am Tag, zwischen allem anderen. Kein Satz ist ein Kampf.</p><p><b>🛑 2 · Nie bis zum Versagen.</b> Die letzte Wiederholung bleibt sauber. So bist du morgen wieder frisch, und genau diese Häufigkeit macht dich stark.</p><p><b>🪜 3 · Leitern.</b> 1 Wiederholung, Pause, 2, Pause, 3, 4, 5 und wieder von vorn. So sammelst du viel Volumen, ohne es zu merken.</p><p><b>⏱️ 4 · Dichte.</b> 15 Minuten, so viele saubere Sätze wie möglich. Nächste Woche mehr. Das ist Steigerung ohne Gewicht.</p><p><b>🌊 5 · Wellen.</b> Schwere, mittlere und leichte Tage im Wechsel. Jede vierte Woche nur das halbe Volumen, damit der Körper alles festigt.</p><p><b>⚡ 6 · Schockmethode.</b> Sprünge und explosive Liegestütze, wenige Wiederholungen, nur frisch. Damit lernt dein Körper, seine Kraft schnell einzusetzen.</p><p>Zu jedem Baustein findest du in der App einen <b>ⓘ-Knopf</b> mit der ganzen Erklärung und den typischen Fehlern.</p>`},
 {e:'📅',t:'So sieht deine Woche aus',h:`<p><b>Montag und Donnerstag, schwer.</b> Erst fünf Minuten Schockmethode, dann Leitern für Drücken und Ziehen, zum Schluss die Beine. Dazu wie immer die verteilten Sätze über den Tag.</p><p><b>Dienstag und Freitag, mittel.</b> Ein Dichteblock von 15 Minuten mit Timer.</p><p><b>Mittwoch und Samstag, leicht.</b> Nur die verteilten Sätze. Ein paar Minuten, mehrmals am Tag.</p><p><b>Sonntag.</b> Kompletter Ruhetag. Essen, schlafen, erholen.</p><p><b>Jede vierte Woche</b> halbierst du das Volumen. Danach machst du den Maximaltest neu, und die App rechnet deine Zahlen neu. Oft steht dann ein neuer Rekord.</p><p>Du musst dir nichts davon merken. Die App zeigt dir jeden Tag die passenden Karten, mit den richtigen Zahlen.</p>`},
 {e:'📱',t:'So hilft dir die App',h:`<p><b>Maximaltest.</b> Einmal so viele saubere Wiederholungen wie möglich, Zahl eintragen. Daraus rechnet die App Satzgröße, Leiter und Dichteblock. Zu schwer? Die App schlägt eine leichtere Stufe vor, zum Beispiel Liegestütze am Tisch statt am Boden. Zu leicht? Die nächste Stufe.</p><p><b>Heute.</b> Große Zahlen zeigen, was zu tun ist: Wiederholungen pro Satz, Sätze heute. Jeder Satz ist ein Tipp auf „＋ Satz“. Der Ring oben zeigt, wie viel vom Tag geschafft ist.</p><p><b>Übungen.</b> 385 Übungen für zu Hause, nach Muskelgruppen sortiert, jede mit Stufen von leicht bis schwer. Zu jeder gibt es ein Beispielvideo und Bilder mit den beteiligten Muskeln. Was du nicht willst, nimmst du aus deinem Plan.</p><p><b>Verlauf.</b> Wiederholungen pro Woche im Vergleich zur Vorwoche, Fortschritt im Dichteblock, alle Einträge, jederzeit änderbar.</p><p><b>Zwei Profile.</b> Jeder hat seinen eigenen Stand und seine eigenen Zahlen. Die Daten bleiben auf dem Handy. Eine Sicherung gibt es in den Einstellungen.</p>`},
 {e:'🏁',t:'Die drei Regeln',h:`<p><b>1 · Qualität vor Zahl.</b> Wird die Wiederholung langsam, krumm oder musst du die Luft anhalten, ist der Satz vorbei. Niemand bewertet dich nach der höchsten Zahl.</p><p><b>2 · Die 15-Minuten-Regel.</b> Könntest du denselben Satz in 15 Minuten nicht genauso sauber wiederholen, war er zu groß. Streich eine oder zwei Wiederholungen.</p><p><b>3 · Das Training setzt das Signal, Essen und Schlaf bauen auf.</b> Genug Eiweiß über den Tag, genug Essen, vernünftiger Schlaf. Ohne Baumaterial wird nichts zu Muskeln.</p><p>Der häufigste Fehler ist Gier: am dritten Tag bei jedem Satz ans Limit gehen, zwei Wochen später tun die Ellbogen weh und man wirft hin. Die Methode verlangt das nie. Sie verlangt nur, dass du oft und sauber übst.</p><p><b>Und die Wahrheit ist hart:</b> Du brauchst kein Fitnessstudio, keine Maschinen und keinen Plan. Du musst aufhören, auf den perfekten Montag zu warten, und heute deinen ersten Satz machen.</p>`}
];
const INFO={
 gtg:{t:'Verteilte Sätze (Grease the Groove)',kurz:'Kleine Sätze über den ganzen Tag verteilt, immer die Hälfte deines Maximums, nie bis zum Versagen.',lang:`<p><b>So geht es:</b> Mach einmal so viele saubere Wiederholungen, wie du schaffst (Maximaltest). Die Hälfte davon ist deine Satzgröße. Schaffst du 12, machst du Sätze mit 6.</p><p>Ab dann machst du mehrmals am Tag einen Satz: nach dem Aufstehen, vor dem Mittagessen, am Nachmittag, vor dem Duschen. 5 bis 8 Sätze pro Tag, mindestens 15 Minuten Abstand, 5 bis 6 Tage pro Woche. Kein Aufwärmen, kein Umziehen, kein schmerzverzerrtes Gesicht.</p><p><b>Die Rechnung:</b> 6 Wiederholungen mal 8 Sätze sind 48 am Tag, fast 300 in der Woche. Wer zweimal pro Woche 3 Sätze bis zum Muskelversagen macht, kommt da nicht annähernd heran.</p><p><b>Das wichtigste Detail:</b> Jeder Satz endet mit dem Gefühl, dass noch mehr gegangen wäre. Wird die letzte Wiederholung langsam, hängt die Hüfte durch oder musst du die Luft anhalten, war der Satz zu groß. Streich eine oder zwei Wiederholungen.</p><p><b>Warum das funktioniert:</b> Kraft ist eine Fähigkeit. Dein Nervensystem lernt, mehr Muskelfasern gleichzeitig anzusteuern. Wie ein Trampelpfad über eine Wiese: Wer einmal pro Woche drüber geht, sieht bald keinen Weg mehr. Wer mehrmals täglich geht, hat nach ein paar Wochen einen festen Pfad.</p><p><b>Der häufigste Fehler:</b> Gier. Am dritten Tag bei jedem Satz ans Limit gehen. Zwei Wochen später tun die Ellbogen weh und man wirft alles hin. Regel: Könntest du denselben Satz 15 Minuten später nicht in derselben Qualität wiederholen, hast du übertrieben.</p>`},
 leiter:{t:'Leitern',kurz:'1 Wiederholung, Pause, 2, Pause, 3 … bis zur obersten Sprosse, dann wieder bei 1. Viel Volumen, kein Muskelversagen.',lang:`<p><b>So geht es:</b> Mach eine Wiederholung, pausiere ein paar Sekunden, mach 2, Pause, 3, Pause, 4, Pause, 5. Das ist eine Leiter mit 15 Wiederholungen. Dann fängst du wieder bei 1 an. Mach 3 bis 5 Leitern.</p><p><b>Die Rechnung:</b> 5 Leitern von 1 bis 5 sind 75 Liegestütze. Wer bei 12 am Stück hängen bleibt, schafft im klassischen Training kaum 75 saubere. Mit der Leiter schon, und kein Satz kommt in die Nähe des Versagens.</p><p><b>Die Pause:</b> Ein paar Mal tief durchatmen, gerade so lange, dass der nächste Satz sauber wird. Nach dem 1er fast keine Pause, nach dem 5er bis zu 30 oder 40 Sekunden.</p><p><b>Bei Klimmzügen:</b> Schaffst du nur 5, nimm Leitern von 1 bis 3. Das sind 6 pro Leiter, 5 Leitern, 30 Klimmzüge.</p><p><b>Der Fehler:</b> Die oberste Sprosse zu früh erhöhen. Wird der 5er unsauber, geht die Leiter nur bis 4. Niemand bewertet dich nach der höchsten Zahl, was zählt, ist das saubere Gesamtvolumen.</p><p><b>Der Trick im Kopf:</b> Ein Satz mit 12 bis zum Versagen fühlt sich wie eine Bedrohung an. Ein einziger Liegestütz wirkt wie ein Witz. Genau deshalb fängst du an, und bevor du es merkst, hast du 75 gemacht.</p>`},
 dichte:{t:'Dichteblock',kurz:'15 Minuten, eine Übung, feste Satzgröße: so viele saubere Sätze wie möglich. Nächste Woche mehr.',lang:`<p><b>So geht es:</b> Timer auf 15 Minuten. Eine Übung, eine angenehme Satzgröße, zum Beispiel 5 Bulgarian Split Squats pro Bein. In den 15 Minuten machst du so viele saubere Sätze wie möglich und pausierst, solange du brauchst. Die Gesamtzahl merken.</p><p><b>Nächste Woche:</b> gleiche Übung, gleiche Zeit, gleiche Satzgröße, Ziel: mehr Sätze. Das ist Steigerung ganz ohne Gewicht. Du hast mehr Arbeit in dasselbe Zeitfenster gepackt, und dafür muss sich dein Körper anpassen: ausdauerndere Muskeln, schnellere Erholung, bessere Technik.</p><p><b>Der Fehler:</b> Die Eile zerstört den Bewegungsumfang. Läuft die Uhr, geht man nur halb runter und glaubt, besser geworden zu sein. Ist man nicht, man hat geschummelt. Ist die Bewegung kürzer geworden, zählt der Satz nicht.</p><p><b>Fortschrittstest:</b> Kommst du in einem Monat in denselben 15 Minuten von 12 auf 16 Sätze, brauchst du keinen Spiegel, um zu wissen, dass du stärker bist.</p>`},
 schock:{t:'Schockmethode',kurz:'Sprünge und explosive Liegestütze: wenige Wiederholungen, volle Pause, nur frisch, höchstens zweimal pro Woche.',lang:`<p><b>Die Idee:</b> Eine schnelle Landung zwingt den Muskel zum Abbremsen, dann explodiert er sofort in die Gegenrichtung. Das trainiert die schnellen Muskelfasern, die das größte Potenzial für Kraft und Wachstum haben.</p><p><b>Drei Stufen:</b> 1. Jump Squats: in angenehme Tiefe gehen, explosiv hochspringen, weich landen, Knie über den Zehenspitzen. 2. Explosive Liegestütze: kontrolliert runter, so kraftvoll hochdrücken, dass die Hände kurz abheben. Geht das noch nicht, Hände auf Sofa oder Bank. 3. Erst nach ein paar Wochen: Niedersprung von einer 30 cm hohen Stufe, landen und sofort so hoch springen wie möglich. Stell dir vor, der Boden ist eine heiße Herdplatte.</p><p><b>Die Regeln:</b> 3 bis 5 Wiederholungen pro Satz, 3 bis 5 Sätze, 1 bis 2 Minuten Pause, höchstens zweimal pro Woche, immer am Anfang des Trainings. Verliert eine Wiederholung ihre Explosivität, ist der Satz vorbei.</p><p><b>Der Fehler:</b> Aus den Sprüngen ein Konditionstraining machen, 15 oder 20 am Stück bis die Lunge brennt. Das macht müde, trainiert aber keine Explosivität. Müde Sprünge sind keine Schockmethode, sondern eine kreative Art, sich den Knöchel zu verstauchen.</p>`},
 split:{t:'Beine an schweren Tagen',kurz:'Bulgarian Split Squats mit 1 bis 3 Wiederholungen in Reserve. Jedes Bein trägt allein einen großen Teil deines Gewichts.',lang:`<p><b>Ausführung:</b> Hinterer Fuß auf Stuhl oder Sofa, der vordere steht ein gutes Stück weiter vorn. Runtergehen, bis das hintere Knie fast den Boden berührt. Wackelt es, Hand an die Wand: Du trainierst deine Beine, du probst keine Zirkusnummer.</p><p><b>Warum diese Übung:</b> Jedes Bein arbeitet allein mit einem großen Teil deines Körpergewichts. Für einen Anfänger ist das mehr als genug Last, damit Oberschenkel und Gesäß richtig brennen.</p><p><b>Wiederholungen in Reserve:</b> An schweren Tagen hörst du auf, wenn du noch 1 bis 3 Wiederholungen schaffen würdest. Da ist der Wachstumsreiz schon hoch, aber die Ermüdung zerstört deine Erholung noch nicht. Die gequälte letzte Wiederholung, bei der du den Körper verdrehst, bringt dem Nervensystem nur die falsche Bewegung bei.</p>`},
 frei:{t:'Freier Eintrag',kurz:'Alles, was nicht im Plan steht: trag ein, was du gemacht hast, damit es im Verlauf mitzählt.',lang:`<p>Ein freier Eintrag ist für alles, was dein Plan heute nicht vorsieht: eine zusätzliche Übung, Boxtraining, ein Spaziergang mit Kniebeugen zwischendurch. Wähle die Übung, zähle die Sätze, fertig. Die Wiederholungen landen im Verlauf.</p><p>Soll eine Übung jeden Tag automatisch erscheinen, nimm sie in deinen Plan: unten auf „Heute“ bei „Aus deinem Plan genommen“ auf „wieder rein“ tippen, oder im Profil das Häkchen setzen. Dann braucht sie einmal einen Maximaltest und die App rechnet die Satzgröße aus.</p>`},
 welle:{t:'Die Woche: Belastung in Wellen',kurz:'Zwei schwere Tage, zwei mittlere, zwei leichte, ein Ruhetag. Jede vierte Woche halbes Volumen.',lang:`<p><b>Die Idee:</b> Der Körper reagiert nicht gut auf ständige Maximalbelastung, er reagiert auf Abwechslung. Harte Tage, mittlere Tage, leichte Tage. Aufbauwochen und leichtere Wochen, in denen der Körper die Arbeit verarbeitet.</p><p><b>Montag und Donnerstag, schwer:</b> Erst 5 Minuten Schockmethode, dann Leitern für Drücken und Ziehen mit der schwersten Stufe, die du sauber kannst, zum Schluss Bulgarian Split Squats.</p><p><b>Dienstag und Freitag, mittel:</b> Ein Dichteblock von 15 Minuten.</p><p><b>Mittwoch und Samstag, leicht:</b> Nur die verteilten Sätze über den Tag.</p><p><b>Sonntag:</b> kompletter Ruhetag.</p><p><b>Jede vierte Woche:</b> Volumen halbieren, Technik sauber halten. Das ist keine Zeitverschwendung, sondern die Woche, in der der Körper alles festigt. Oft steht danach ein neuer Rekord im Test. Danach machst du den Maximaltest neu und die App rechnet deine Satzgrößen neu.</p><p><b>Schwerer ohne Gewicht:</b> Statt Hantelscheiben veränderst du die Hebel, vergrößerst den Bewegungsumfang, trainierst einseitig, baust Pausen ein oder gehst langsamer runter. Ein Liegestütz mit 3 Sekunden Abwärtsphase und 2 Sekunden Pause unten ist eine völlig andere Übung.</p><p><b>Übertraining?</b> Entsteht selten durch die Häufigkeit allein, sondern durch Häufigkeit plus Maximalintensität plus schlechte Erholung. Der Großteil deines Trainings ist weit weg vom Versagen. Und: Genug Eiweiß, genug Essen, vernünftiger Schlaf. Das Training setzt das Signal, Essen und Erholung bauen auf.</p>`},
 test:{t:'Maximaltest',kurz:'So viele saubere Wiederholungen wie möglich. Daraus rechnet die App alles: Satzgröße, Leiter, Dichteblock.',lang:`<p><b>So geht es:</b> Mach so viele Wiederholungen mit sauberer Technik, wie du schaffst. Bei Liegestützen: Körper in einer Linie, Brust fast bis zum Boden, oben die Arme ganz durchstrecken. Die Zahl merken und eintragen.</p><p><b>Was die App daraus macht:</b> Die Hälfte ist die Satzgröße für die verteilten Sätze. Die oberste Sprosse der Leiter liegt zwischen 1 und 5. Der Dichteblock nutzt die gleiche Satzgröße.</p><p><b>Wann neu testen:</b> Nach jeder leichten Woche, also alle vier Wochen. Die App erinnert dich daran.</p><p><b>Zu schwer oder zu leicht:</b> Schaffst du noch keine 5 Liegestütze auf dem Boden, fang mit den Händen auf Tisch oder Wand an. Je aufrechter, desto leichter. Über die Wochen gehst du mit der Höhe runter. Schaffst du über 20, nimm beim nächsten Test die nächste Stufe. Die Methode bleibt dieselbe, nur dein Startpunkt ist ein anderer.</p>`}
};
const BLOCKS={'gtg|push':'Verteilte Sätze Drücken','gtg|pull':'Verteilte Sätze Ziehen','gtg|legs':'Kniebeugen über den Tag verteilt','leiter|push':'Leitern Drücken (schwere Tage)','leiter|pull':'Leitern Ziehen (schwere Tage)','split|legs':'Beine an schweren Tagen','schock|*':'Schockmethode (schwere Tage)','dichte|*':'Dichteblock (mittlere Tage)'};

function mergeLibrary(st){const have=new Set(st.exercises.map(e=>e.id));const byId={};EX_DEFAULT.forEach(e=>{byId[e.id]=e;});
  st.exercises.forEach(e=>{if(!e.muscle){const l=byId[e.id];e.muscle=l?l.muscle:(Object.keys(MUSCLES).find(m=>MUSCLES[m].slot===e.slot&&m!=='sonstige')||'sonstige');}if(!e.slot)e.slot=(MUSCLES[e.muscle]||MUSCLES.sonstige).slot;});
  EX_DEFAULT.forEach(e=>{if(!have.has(e.id))st.exercises.push(Object.assign({},e,{levels:e.levels.slice()}));});return st;}
function mkProfile(name,emoji){return {id:uid(),name,emoji,cycleStart:todayISO(),push:'ex_push',pull:'ex_row',legs:'ex_split',dichte:'ex_split',schock:'ex_jump',off:{'gtg|legs':true}};}

function numbers(pid,exId,upto){const t=latestTest(pid,exId,upto);if(!t)return null;const M=t.max;const half=Math.max(1,Math.round(M/2));
  const n={test:t,max:M,level:t.level,gtgReps:half,ladderTop:M>=12?5:M>=8?4:M>=5?3:M>=3?2:1,dichteReps:half,splitReps:Math.min(10,Math.max(5,half)),hint:M>=20?'schwerer':M<5?'leichter':null,vorschlag:{reps:half,ladder:M>=12?5:M>=8?4:M>=5?3:M>=3?2:1},adj:null};
  const pr=S.profiles.find(x=>x.id===pid);const a=pr&&pr.adj&&pr.adj[exId];

function entries(pid,iso){return S.log.filter(l=>l.pid===pid&&l.date===iso);}
function findEntry(pid,iso,kind,exId){return S.log.find(l=>l.pid===pid&&l.date===iso&&l.kind===kind&&(kind==='schock'||kind==='dichte'?true:l.exId===exId))||null;}
function volume(l){const s=+l.sets||0,r=+l.reps||0;if(l.kind==='leiter')return s*(r*(r+1)/2);return s*r;}
function dayPlan(p,iso){
  const type=DAY[fromISO(iso).getDay()];const c=cycle(p,iso);const dl=c.deload;let blocks=[];
  if(type==='ruhe')return {type,c,blocks,off:[]};
  if(type==='schwer'){
    blocks.push({key:'schock|*',kind:'schock',exId:null,sets:dl?[2,2]:[3,5],reps:dl?'3':'3–5'});
    blocks.push({key:'leiter|push',kind:'leiter',exId:p.push,sets:dl?[2,2]:[3,5]});
    blocks.push({key:'leiter|pull',kind:'leiter',exId:p.pull,sets:dl?[2,2]:[3,5]});
    blocks.push({key:'split|legs',kind:'split',exId:p.legs,sets:dl?[2,2]:[3,3]});
  }
  if(type==='mittel')blocks.push({key:'dichte|*',kind:'dichte',exId:null,minutes:dl?8:15});
  blocks.push({key:'gtg|push',kind:'gtg',exId:p.push,sets:dl?[3,4]:[5,8]});
  blocks.push({key:'gtg|pull',kind:'gtg',exId:p.pull,sets:dl?[3,4]:[5,8]});
  blocks.push({key:'gtg|legs',kind:'gtg',exId:'ex_squat',sets:dl?[3,4]:[5,8]});
  const off=blocks.filter(b=>p.off&&p.off[b.key]).map(b=>b.key);
  blocks=blocks.filter(b=>!(p.off&&p.off[b.key]));
  return {type,c,blocks,off};
}

/* ---------- Oberfläche ---------- */
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=msg;clearTimeout(t._h);t._h=setTimeout(()=>t.remove(),2200);}
function render(){const y=window.scrollY;renderHeader();const m=$('#main');
  if(UI.view==='verlauf')m.innerHTML=viewVerlauf();else if(UI.view==='tests')m.innerHTML=viewTests();else if(UI.view==='einstellungen')m.innerHTML=viewEinstellungen();else{UI.view='heute';m.innerHTML=viewHeute();}
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===UI.view));
  if(location.hash!=='#'+UI.view)history.replaceState(null,'','#'+UI.view);
  window.scrollTo(0,y);timerPaint();}
function renderHeader(){$('#profiles').innerHTML=S.profiles.map(p=>`<button class="chip${p.id===S.active?' on':''}" data-act="profile" data-id="${p.id}">${esc(p.emoji)} ${esc(p.name)}</button>`).join('');}
const opt=(list,val,fn)=>list.map(x=>`<option value="${esc(x.id)}"${x.id===val?' selected':''}>${esc(fn?fn(x):x.name)}</option>`).join('');
const exOptions=(val,filter)=>['push','pull','legs','schock'].filter(s=>!filter||filter(s)).map(s=>`<optgroup label="${SLOT[s]}">${opt(bySlot(s),val)}</optgroup>`).join('');
function pickLabel(id){const e=ex(id);return e?`<span class="pk-name">${esc(e.name)}</span><small>${esc(muscleName(e))} · tippen zum Ändern</small>`:'<span class="pk-name">Übung wählen</span><small>tippen</small>';}
const pickBtn=(target,value,filter,cls)=>`${target.startsWith('f-')?`<input type="hidden" id="${target}" value="${esc(value||'')}">`:''}<button type="button" class="${cls||'btn big'} pick" data-act="pickEx" data-target="${target}" data-filter="${filter||''}">${pickLabel(value)}<i>▾</i></button>`;
const ytUrl=e=>'https://www.youtube.com/results?search_query='+encodeURIComponent((e?e.name:'')+' Übung richtige Ausführung');
const imgUrl=e=>'https://www.google.com/search?tbm=isch&q='+encodeURIComponent((e?e.name:'')+' Übung Muskeln Anatomie');
const demoLinks=e=>e?`<div class="row demo"><a class="btn sm" href="${ytUrl(e)}" target="_blank" rel="noopener">▶️ Beispielvideo</a><a class="btn sm" href="${imgUrl(e)}" target="_blank" rel="noopener">🖼️ Muskelbilder</a></div>`:'';
const sure=(id,label)=>UI.sure===id?`<button class="btn danger sure" data-act="${label}" data-id="${id}">Wirklich löschen?</button>`:`<button class="btn danger" data-act="${label}" data-id="${id}">🗑 Löschen</button>`;

/* ---------- Heute ---------- */
function viewHeute(){
  const p=prof();const iso=UI.date;const plan=dayPlan(p,iso);const d=fromISO(iso);const di=DAYINFO[plan.type];
  let h='';
  // Wochenleiste
  const mon=mondayOf(iso);
  h+=`<div class="week"><button class="arrow" data-act="week" data-n="-7">‹</button>`;
  for(let i=0;i<7;i++){const x=addDays(mon,i);const has=entries(p.id,x).some(l=>l.sets>0);h+=`<button class="day${x===iso?' sel':''}${x===todayISO()?' today':''}" data-act="day" data-iso="${x}">${WDS[fromISO(x).getDay()]}<b>${fromISO(x).getDate()}</b><i class="dot${has?' on':''}"></i></button>`;}
  h+=`<button class="arrow" data-act="week" data-n="7">›</button></div>`;
  // Tageskopf
  const pct=dayProgress(p,iso,plan);const C=2*Math.PI*34;
  h+=`<div class="card hero"><div class="herorow"><div class="dayhead"><div class="em">${di.e}</div><div style="min-width:0"><div class="big">${di.n}</div><div class="sub">${WD[d.getDay()]}, ${fmtDate(iso)}${iso!==todayISO()?' · <a href="#" data-act="today">zu heute</a>':''}</div></div></div>${plan.type!=='ruhe'?`<div class="ring"><svg viewBox="0 0 84 84"><circle class="tr" cx="42" cy="42" r="34"/><circle class="pr" cx="42" cy="42" r="34" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"/></svg><b>${pct}%</b><small>geschafft</small></div>`:''}</div><div class="hint" style="margin-top:14px">${di.t}</div><div style="margin-top:8px">${infoBtn('welle')} <span class="hint">So ist die Woche aufgebaut</span></div>`;
  const c=plan.c;
  if(c.before)h+=`<div class="hint" style="margin-top:8px">Zyklus startet am ${fmtDate(p.cycleStart)} (Einstellungen → Profil).</div>`;
  else h+=`<div style="margin-top:10px"><span class="pill ${c.deload?'blue':'red'}">Woche ${c.week} · Zyklus-Woche ${c.cw} von 4</span> ${c.deload?'<span class="pill blue">Leichte Woche: halbes Volumen</span>':''}</div>`;
  h+=`</div>`;
  // Maximaltest-Hinweise
  const anyTest=S.tests.some(t=>t.pid===p.id);
  if(!anyTest){h+=`<div class="card soft"><div class="bh"><div class="be">🧪</div><div><div class="bt">Schritt 1: Maximaltest</div><div class="bs">Mach so viele saubere ${esc(exName(p.push))} wie du schaffst und trag die Zahl ein. Daraus rechnet die App deine Satzgröße, die Leiter und den Dichteblock aus.</div></div></div><div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="addTest" data-ex="${p.push}">＋ Maximaltest eintragen</button></div></div>`;}
  else if(!c.before&&c.cw===1&&!latestTest(p.id,p.push,iso)||(!c.before&&c.cw===1&&daysBetween(latestTest(p.id,p.push,iso).date,iso)>10)){h+=`<div class="card warn"><div class="bh"><div class="be">🧪</div><div><div class="bt">Neuer Maximaltest fällig</div><div class="bs">Zyklus-Woche 1: Nach der leichten Woche testest du neu und die Satzgrößen werden neu berechnet.</div></div></div><div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="addTest" data-ex="${p.push}">＋ Maximaltest eintragen</button></div></div>`;}
  if(plan.type==='ruhe'){h+=`<div class="card ok"><div class="bh"><div class="be">🛋️</div><div><div class="bt">Heute nichts geplant</div><div class="bs">Sonntag ist frei. Wenn du trotzdem etwas gemacht hast, trag es als freien Eintrag ein.</div></div></div></div>`;}
  const session=plan.blocks.filter(b=>b.kind!=='gtg'),gtg=plan.blocks.filter(b=>b.kind==='gtg');
  if(session.length){h+=`<h2>Training</h2>`+session.map(b=>blockCard(p,iso,b,plan)).join('');}
  if(gtg.length){h+=`<h2>Über den Tag verteilt</h2>`+gtg.map(b=>blockCard(p,iso,b,plan)).join('');}
  // Sonstige Einträge des Tages (frei / nicht im Plan)
  const planned=new Set(plan.blocks.map(b=>b.kind+'|'+(b.exId||'*')));
  const extra=entries(p.id,iso).filter(l=>!(planned.has(l.kind+'|'+l.exId)||((l.kind==='schock'||l.kind==='dichte')&&planned.has(l.kind+'|*'))));
  if(extra.length){h+=`<h2>Weitere Einträge</h2>`+extra.map(entryCard).join('');}
  h+=`<button class="btn big" data-act="newEntry">＋ Freier Eintrag für diesen Tag</button>`;
  if(plan.off.length)h+=`<div class="hint" style="margin-top:14px">Aus deinem Plan genommen: ${plan.off.map(k=>`${esc(blockName(k))} <a href="#" data-act="blockOn" data-key="${k}">wieder rein</a>`).join(' · ')}</div>`;
  return h;
}
function blockCard(p,iso,b,plan){
  const k=KIND[b.kind];let exId=b.exId;let e=findEntry(p.id,iso,b.kind,exId);
  if(b.kind==='schock')exId=(e&&e.exId)||p.schock;if(b.kind==='dichte')exId=(e&&e.exId)||p.dichte;
  const n=numbers(p.id,exId,iso);const sets=e?+e.sets:0;
  let title='',tiles=[],line='',tip='',mid='',goal=b.sets?b.sets[1]:0,min=b.sets?b.sets[0]:0,unit=k.u,unitD=k.u==='Sätze'?'Sätzen':k.u,incReps=0;
  const range=(a,b2)=>a===b2?String(a):a+'–'+b2;
  if(b.kind==='gtg'){
    if(!n)return missingTest(exId,k,'Verteilte Sätze',b.key);
    title=`${esc(exName(exId))} · ${esc(n.level)}`;incReps=n.gtgReps;
    tiles=[{v:n.gtgReps,l:'Wdh. pro Satz',main:true},{v:range(min,goal),l:'Sätze heute'}];
    line='Über den Tag verteilt, mind. 15 Min. Abstand.';tip='Jeder Satz endet mit dem Gefühl, dass noch mehr ginge. Wird die letzte Wiederholung langsam oder krumm, streich eine.';
  }else if(b.kind==='leiter'){
    if(!n)return missingTest(exId,k,'Leitern',b.key);
    title=`Leitern ${esc(exName(exId))} · ${esc(n.level)}`;incReps=n.ladderTop;
    tiles=[{v:'1→'+n.ladderTop,l:'Wdh., Sprosse für Sprosse',main:true},{v:range(min,goal),l:'Leitern'}];
    line='1 Wdh., kurze Pause, 2, Pause … bis '+n.ladderTop+'. Dann wieder bei 1.';
    mid=`<div class="ladder">${Array.from({length:n.ladderTop},(_,i)=>`<span${i===n.ladderTop-1?' class="top"':''}>${i+1}</span>`).join('')}<span>↺</span></div>`;
    tip='Pause: ein paar tiefe Atemzüge, nach der obersten Sprosse bis 30–40 Sekunden. Wird die oberste Sprosse unsauber, geht die Leiter nur bis zur Sprosse darunter.';
  }else if(b.kind==='split'){
    const reps=n?n.splitReps:6;incReps=reps;title=`${esc(exName(exId))}${n?' · '+esc(n.level):''}`;
    tiles=[{v:reps,l:'Wdh. pro Bein',main:true},{v:goal,l:'Sätze'}];
    line='Hinterer Fuß auf Stuhl oder Sofa, Knie fast bis zum Boden.';tip=(n?'':'Ohne Maximaltest für die Beine rechnet die App mit 6 pro Bein. ')+'1–3 Wiederholungen in Reserve lassen. Wackelt es, Hand an die Wand.';
  }else if(b.kind==='schock'){
    title='Schockmethode';incReps=plan.c.deload?3:4;
    tiles=[{v:b.reps,l:'Wdh. pro Satz',main:true},{v:range(min,goal),l:'Sätze'}];
    line='1–2 Min. Pause. Immer zuerst, solange du frisch bist.';
    mid=pickBtn('card:schock',exId,'slot:schock','sel pick');
    tip='Satz vorbei, sobald eine Wiederholung ihre Explosivität verliert. Höchstens 2× pro Woche. Müde Sprünge sind keine Schockmethode.';
  }else if(b.kind==='dichte'){
    const reps=e&&e.reps?+e.reps:(n?n.dichteReps:5);const mins=e&&e.minutes?+e.minutes:b.minutes;goal=0;min=0;incReps=reps;
    const prev=S.log.filter(l=>l.pid===p.id&&l.kind==='dichte'&&l.exId===exId&&l.date<iso&&l.sets>0).sort((a,b2)=>b2.date.localeCompare(a.date));
    const best=prev.reduce((m,l)=>Math.max(m,+l.sets),0);
    title='Dichteblock';
    tiles=[{v:mins,l:'Minuten',main:true},{v:reps,l:'Wdh. pro Satz'+(exId===p.legs?' und Bein':'')}];
    line=prev.length?`Letztes Mal ${prev[0].sets} Sätze (${fmtShort(prev[0].date)}), Rekord ${best}. Heute mehr?`:'So viele saubere Sätze wie möglich, Pausen nach Bedarf.';
    mid=pickBtn('card:dichte',exId,'not:schock','sel pick')+`
      <div class="timer"><div class="tdisp" id="tdisp" data-min="${mins}">${mmss(T.left)}</div><button class="btn grow primary" id="tstart" data-act="tStart" data-min="${mins}">▶︎ Start</button><button class="btn" data-act="tReset" data-min="${mins}">↺</button></div>`;
    tip='Voller Bewegungsumfang, sonst zählt der Satz nicht. Nächste Woche: gleiche Übung, gleiche Zeit, mehr Sätze.';
    unit='Sätze';unitD='Sätzen';
  }
  const okMin=min&&sets>=min;const pct=goal?Math.min(100,Math.round(sets/goal*100)):0;
  return `<div class="card"><div class="bh"><div class="be">${k.e}</div><div style="min-width:0"><div class="bt">${title}</div></div>${infoBtn(b.kind)}</div>
    <div class="rx">${tiles.map(t=>`<div${t.main?(b.kind!=='schock'?` class="main tap" data-act="adjust" data-ex="${exId}"`:' class="main"'):''}><b>${t.v}</b><span>${t.l}${t.main&&b.kind!=='schock'?' · ✎ ändern':''}</span></div>`).join('')}</div>
    <div class="line">${line}</div>${mid}
    <div class="counter"><button class="rbtn" data-act="dec" data-kind="${b.kind}" data-ex="${exId}"${sets?'':' disabled'}>−</button><div class="cnum">${sets}${goal?`<small>von ${goal} ${unitD}</small>`:`<small>${unit}</small>`}</div><button class="btn primary grow" style="min-height:56px;font-size:19px" data-act="inc" data-kind="${b.kind}" data-ex="${exId}" data-reps="${incReps}" data-min="${b.minutes||''}">＋ ${b.kind==='leiter'?'Leiter':'Satz'}</button></div>
    ${goal?`<div class="bar"><i class="${okMin?'ok':''}" style="width:${pct}%"></i></div>`:''}
    ${okMin&&sets<goal?'<div class="hint" style="margin-top:6px">✅ Minimum geschafft, Rest ist Bonus.</div>':sets>=goal&&goal?'<div class="hint" style="margin-top:6px">✅ Ziel erreicht. Mehr ist heute nicht nötig.</div>':''}
    <details class="tip"><summary>ℹ️ Hinweis${e?' · ✎ Eintrag bearbeiten':''}</summary><div class="dbody">${tip}${e?` <a href="#" data-act="editEntry" data-id="${e.id}">✎ Eintrag bearbeiten${e.note?' · Notiz: '+esc(e.note):''}</a>`:''}${demoLinks(ex(exId))}<div style="margin-top:8px"><button class="btn sm" data-act="blockOff" data-key="${b.key}">🚫 Aus meinem Plan nehmen</button></div></div></details></div>`;
}
function dayProgress(p,iso,plan){let tot=0,done=0;plan.blocks.forEach(b=>{if(b.kind==='dichte'){const e=findEntry(p.id,iso,'dichte',null);tot+=1;done+=e&&e.sets>0?1:0;return;}const min=b.sets?b.sets[0]:0;if(!min)return;const e=findEntry(p.id,iso,b.kind,b.exId);tot+=min;done+=Math.min(min,e?+e.sets:0);});return tot?Math.round(done/tot*100):0;}
function missingTest(exId,k,label,key){return `<div class="card warn"><div class="bh"><div class="be">${k.e}</div><div style="min-width:0"><div class="bt">${label} ${esc(exName(exId))}</div><div class="bs">Dafür fehlt noch der Maximaltest. Erst testen, dann rechnet die App die Sätze aus.</div></div>${infoBtn('test')}</div><div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="addTest" data-ex="${exId}">＋ Maximaltest</button><button class="btn" data-act="blockOff" data-key="${key}">🚫 Weglassen</button></div>${demoLinks(ex(exId))}</div>`;}
function entryCard(l){const k=KIND[l.kind]||KIND.frei;const e=ex(l.exId);const reps=+l.reps||0;const sets=+l.sets||0;const ges=l.kind==='leiter'?sets*(reps*(reps+1)/2):sets*reps;
  return `<div class="card"><div class="bh"><div class="be">${k.e}</div><div style="min-width:0"><div class="bt">${esc(exName(l.exId))}</div><div class="bs">${k.n}${l.kind==='dichte'&&l.minutes?' · '+l.minutes+' Min.':''}</div></div>${infoBtn(l.kind)}</div>
    <div class="rx"><div class="main"><b>${reps||'–'}</b><span>${l.kind==='leiter'?'Oberste Sprosse':'Wdh. pro Satz'}</span></div><div><b>${ges}</b><span>Wdh. gesamt</span></div></div>
    <div class="counter"><button class="rbtn" data-act="entDec" data-id="${l.id}"${sets?'':' disabled'}>−</button><div class="cnum">${sets}<small>${l.kind==='leiter'?'Leitern':'Sätze'}</small></div><button class="btn primary grow" style="min-height:56px;font-size:19px" data-act="entInc" data-id="${l.id}">＋ ${l.kind==='leiter'?'Leiter':'Satz'}</button></div>
    <details class="tip"><summary>ℹ️ Hinweis · ✎ Eintrag bearbeiten</summary><div class="dbody">${INFO[l.kind]?INFO[l.kind].kurz:''} <a href="#" data-act="editEntry" data-id="${l.id}">✎ Eintrag bearbeiten${l.note?' · Notiz: '+esc(l.note):''}</a>${demoLinks(e)}</div></details></div>`;}
function entryRow(l){const k=KIND[l.kind]||KIND.frei;const v=volume(l);return `<a class="item" href="#" data-act="editEntry" data-id="${l.id}"><div class="ie">${k.e}</div><div class="it"><b>${esc(exName(l.exId))}</b><span>${k.n}${l.kind==='dichte'&&l.minutes?' · '+l.minutes+' Min.':''}${l.kind==='leiter'?' · bis Sprosse '+l.reps:l.reps?' · '+l.reps+' Wdh.':''}${l.note?' · '+esc(l.note):''}</span></div><div class="iv">${l.sets}<small>${k.u}${v?' · '+v+' Wdh.':''}</small></div></a>`;}

/* ---------- Verlauf ---------- */
function viewVerlauf(){
  const p=prof();const all=S.log.filter(l=>l.pid===p.id&&(l.sets>0||l.note)).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  const wk=mondayOf(todayISO()),lastWk=addDays(wk,-7);
  const vol=(from,to,slot)=>all.filter(l=>l.date>=from&&l.date<=to&&ex(l.exId)&&ex(l.exId).slot===slot).reduce((s,l)=>s+volume(l),0);
  let h=`<h2>Diese Woche · ab ${fmtShort(wk)}</h2><div class="kpi">
    <div class="k k1"><b>${vol(wk,addDays(wk,6),'push')}</b><span>Wdh. Drücken (Vorwoche ${vol(lastWk,addDays(lastWk,6),'push')})</span></div>
    <div class="k k2"><b>${vol(wk,addDays(wk,6),'pull')}</b><span>Wdh. Ziehen (Vorwoche ${vol(lastWk,addDays(lastWk,6),'pull')})</span></div>
    <div class="k"><b>${vol(wk,addDays(wk,6),'legs')}</b><span>Wdh. Beine (Vorwoche ${vol(lastWk,addDays(lastWk,6),'legs')})</span></div>
    <div class="k"><b>${new Set(all.filter(l=>l.date>=wk).map(l=>l.date)).size}</b><span>Trainingstage diese Woche</span></div></div>`;
  const dichte=all.filter(l=>l.kind==='dichte'&&l.sets>0).slice(0,8);
  if(dichte.length){h+=`<h2>Dichteblöcke · Fortschritt</h2><div class="card" style="overflow-x:auto"><table><tr><th>Datum</th><th>Übung</th><th class="num">Min.</th><th class="num">Sätze</th><th class="num">Wdh.</th></tr>`+dichte.map(l=>`<tr><td>${fmtShort(l.date)}</td><td>${esc(exName(l.exId))}</td><td class="num">${l.minutes||''}</td><td class="num"><b>${l.sets}</b></td><td class="num">${volume(l)}</td></tr>`).join('')+`</table></div>`;}
  h+=`<h2>Alle Einträge</h2>`;
  if(!all.length)h+=`<div class="card hint">Noch keine Einträge. Auf „Heute“ zählst du jeden Satz mit einem Tipp.</div>`;
  let cur='';all.forEach(l=>{if(l.date!==cur){if(cur)h+='</div>';cur=l.date;const t=DAY[fromISO(l.date).getDay()];h+=`<div class="datehead"><b>${WD[fromISO(l.date).getDay()]}, ${fmtDate(l.date)}</b><span>${DAYINFO[t].e} ${DAYINFO[t].n}</span></div><div class="card list">`;}h+=entryRow(l);});
  if(cur)h+='</div>';
  h+=`<button class="btn big" data-act="newEntry" data-today="1">＋ Eintrag nachtragen</button>`;
  return h;
}

/* ---------- Tests ---------- */
function viewTests(){
  const p=prof();const used=[p.push,p.pull,p.legs,p.dichte].filter((x,i,a)=>x&&a.indexOf(x)===i);
  const ids=used.concat(S.exercises.filter(e=>e.slot!=='schock'&&!used.includes(e.id)&&S.tests.some(t=>t.pid===p.id&&t.exId===e.id)).map(e=>e.id));
  let h=`<div class="card blue"><div class="bh"><div class="be">🧪</div><div style="min-width:0"><div class="bt">Maximaltest</div><div class="bs">So viele saubere Wiederholungen wie möglich, einmal pro Übung. Daraus rechnet die App: Satzgröße = Hälfte, Leiter bis 1–5, Dichteblock. Neu testen nach jeder leichten Woche. <b>Tippe auf einen Test, um ihn zu ändern oder zu löschen.</b></div></div>${infoBtn('test')}</div><div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="addTest">＋ Maximaltest eintragen</button></div></div>`;
  ids.forEach(id=>{const e=ex(id);if(!e)return;const list=S.tests.filter(t=>t.pid===p.id&&t.exId===id).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));const n=numbers(p.id,id);
    h+=`<h2>${esc(e.name)} · ${SLOT[e.slot]}</h2><div class="card">`;

  return h;
}

/* ---------- Timer ---------- */
const T={total:900,left:900,running:false,endAt:0,iv:null,done:false};
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function timerPaint(){const el=$('#tdisp');if(el){if(!T.running&&!T.done&&T.left===T.total&&+el.dataset.min*60!==T.total){T.total=T.left=+el.dataset.min*60;}el.textContent=mmss(T.left);el.classList.toggle('done',T.done);}const b=$('#tstart');if(b)b.textContent=T.running?'⏸ Pause':(T.left<T.total&&T.left>0?'▶︎ Weiter':'▶︎ Start');}
function tick(){T.left=Math.max(0,Math.round((T.endAt-Date.now())/1000));if(T.left<=0){T.left=0;T.running=false;clearInterval(T.iv);T.iv=null;T.done=true;beep();toast('⏱️ Zeit ist um – Sätze eintragen');}timerPaint();}
function timerStart(min){if(T.running){T.running=false;clearInterval(T.iv);T.iv=null;timerPaint();return;}if(T.done||T.left<=0){T.total=T.left=min*60;T.done=false;}T.running=true;T.endAt=Date.now()+T.left*1000;T.iv=setInterval(tick,500);timerPaint();}
function timerReset(min){T.running=false;clearInterval(T.iv);T.iv=null;T.total=T.left=min*60;T.done=false;timerPaint();}
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,A.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+t+.25);o.start(A.currentTime+t);o.stop(A.currentTime+t+.3);});}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.running)tick();});

/* ---------- Zahlenrad (wischen oder antippen statt tippen) ---------- */
const NP_W=56;
function numPick(id,value,min,max,hint){const v=Math.min(max,Math.max(min,Math.round(+value)||min));let cells='';for(let i=min;i<=max;i++)cells+=`<button type="button" class="np-cell${i===v?' on':''}" data-act="npPick" data-id="${id}" data-v="${i}">${i}</button>`;
  return `<input type="hidden" id="${id}" value="${v}"><div class="np" data-np="${id}" data-min="${min}" data-max="${max}"><button type="button" class="np-btn" data-act="npStep" data-id="${id}" data-d="-1">−</button><div class="np-strip"><div class="np-track">${cells}</div></div><button type="button" class="np-btn" data-act="npStep" data-id="${id}" data-d="1">＋</button></div>${hint?`<div class="np-hint" id="${id}-hint">${hint}</div>`:''}`;}
function npSet(id,v,scroll){const np=document.querySelector(`.np[data-np="${id}"]`);if(!np)return;const min=+np.dataset.min,max=+np.dataset.max;v=Math.min(max,Math.max(min,Math.round(v)));$('#'+id).value=v;np.querySelectorAll('.np-cell').forEach(c=>c.classList.toggle('on',+c.dataset.v===v));
  if(scroll!==false)npScroll(np,(v-min)*NP_W,true);}
function npScroll(np,left,smooth){const strip=np.querySelector('.np-strip');strip._quiet=Date.now()+(smooth?600:150);if(smooth)strip.scrollTo({left,behavior:'smooth'});else strip.scrollLeft=left;}
function npPlace(){document.querySelectorAll('.np').forEach(np=>{const id=np.dataset.np;const v=+$('#'+id).value||0;npScroll(np,(v-(+np.dataset.min))*NP_W,false);});}
function npInit(){document.querySelectorAll('.np').forEach(np=>{if(np._init)return;np._init=true;const id=np.dataset.np;const strip=np.querySelector('.np-strip');let t;
  strip.addEventListener('scroll',()=>{if(Date.now()<(strip._quiet||0))return;clearTimeout(t);t=setTimeout(()=>{const i=Math.round(strip.scrollLeft/NP_W);npSet(id,i+(+np.dataset.min),false);if(Math.abs(strip.scrollLeft-i*NP_W)>1)npScroll(np,i*NP_W,true);},120);});});
  npPlace();setTimeout(npPlace,250);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(npPlace,50));}
function npHint(id,text){const h=$('#'+id+'-hint');if(h)h.textContent=text;}

  if(kind==='dichte')return n?{reps:n.dichteReps,why:'Satzgröße für den Dichteblock',minutes:15}:{reps:5,why:'Satzgröße (Schätzung)',minutes:15};

  save();closeModal();render();toast('Profil gespeichert');}

function exerciseModal(id){
  const e=id?ex(id):{id:null,name:'',muscle:'brust',slot:'push',levels:['Leicht','Normal','Schwer']};if(!e)return;M={type:'exercise',id};
  modal(id?'Übung bearbeiten':'Neue Übung',`
    <div class="field"><label>Name</label><input type="text" id="f-name" value="${esc(e.name)}" placeholder="z. B. Dips am Stuhl"></div>
    <div class="field"><label>Muskelgruppe</label><select id="f-muscle">${Object.keys(MUSCLES).map(m=>`<option value="${m}"${m===(e.muscle||'sonstige')?' selected':''}>${MUSCLES[m].e} ${MUSCLES[m].n}</option>`).join('')}</select></div>
    <div class="field"><label>Stufen, leicht → schwer (eine pro Zeile)</label><textarea id="f-levels" style="min-height:120px">${esc(e.levels.join('\n'))}</textarea></div>${id?demoLinks(e):''}`,
    `<button class="btn primary grow" data-act="mSave">💾 Speichern</button>${id?sure(id,'mDelete'):''}`);
}
function saveExercise(){const name=val('f-name');if(!name){toast('Bitte einen Namen eingeben');return;}
  const levels=$('#f-levels').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!levels.length)levels.push('Normal');
  const muscle=val('f-muscle')||'sonstige';const d={name,muscle,slot:MUSCLES[muscle].slot,levels};
  if(M.id)Object.assign(ex(M.id),d);else S.exercises.push(Object.assign({id:'ex_'+uid()},d));
  save();closeModal();render();toast('Übung gespeichert');}

function exportJSON(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='methode-sicherung-'+todayISO()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Sicherung wird gespeichert');}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!(s&&s.v===1&&Array.isArray(s.profiles)&&Array.isArray(s.log)&&Array.isArray(s.tests)&&Array.isArray(s.exercises)))throw 0;S=s;if(!S.profiles.find(p=>p.id===S.active))S.active=S.profiles[0].id;save();render();toast('Sicherung geladen');}catch(e){toast('Das ist keine gültige Sicherung');}};r.readAsText(file);}

/* ---------- Übungs-Auswahl ---------- */
const PK={target:'',filter:'',muscle:'',q:'',current:''};
const pkPass=e=>!(PK.filter.startsWith('slot:')&&e.slot!==PK.filter.slice(5))&&!(PK.filter.startsWith('not:')&&e.slot===PK.filter.slice(4));
function openPicker(target,filter,current){PK.target=target;PK.filter=filter||'';PK.muscle='';PK.q='';PK.current=current||'';$('#pk-q').value='';renderPicker();$('#picker').hidden=false;$('#pk-list').scrollTop=0;}
function renderPicker(){const ms=Object.keys(MUSCLES).filter(m=>S.exercises.some(e=>(e.muscle||'sonstige')===m&&pkPass(e)));
  $('#pk-chips').innerHTML=`<button class="chip${!PK.muscle?' on':''}" data-act="pkMuscle" data-m="">Alle</button>`+ms.map(m=>`<button class="chip${PK.muscle===m?' on':''}" data-act="pkMuscle" data-m="${m}">${MUSCLES[m].e} ${MUSCLES[m].n}</button>`).join('');
  const q=PK.q.toLowerCase();const list=S.exercises.filter(e=>pkPass(e)&&(!PK.muscle||(e.muscle||'sonstige')===PK.muscle)&&(!q||e.name.toLowerCase().includes(q)||muscleName(e).toLowerCase().includes(q)));
  $('#pk-count').textContent=list.length+' Übungen';
  $('#pk-list').innerHTML=list.length?list.map(e=>`<div class="pk-item${e.id===PK.current?' on':''}"><button type="button" class="pk-main" data-act="pkSel" data-id="${e.id}"><b>${esc(e.name)}</b><span>${esc(muscleName(e))} · ${esc(e.levels.slice(0,3).join(' → '))}${e.levels.length>3?' …':''}</span></button><a class="pk-yt" href="${ytUrl(e)}" target="_blank" rel="noopener" title="Beispielvideo">▶️</a></div>`).join(''):'<div class="hint" style="padding:16px">Nichts gefunden. In den Einstellungen kannst du eigene Übungen anlegen.</div>';}
function pickDone(id){const t=PK.target;$('#picker').hidden=true;
  if(t.startsWith('card:')){const kind=t.slice(5);const p=prof();const e=findEntry(p.id,UI.date,kind,null);if(e)e.exId=id;p[kind]=id;save();render();return;}
  const inp=$('#'+t);if(inp)inp.value=id;const btn=document.querySelector(`.pick[data-target="${t}"]`);if(btn)btn.innerHTML=pickLabel(id)+'<i>▾</i>';
  if(t==='f-ex'&&M&&M.type==='test')CHG.testEx({value:id});
  if(t==='f-ex'&&M&&M.type==='entry')applyKind(val('f-kind'));}

let introPage=0;
function openIntro(n){introPage=n||0;renderIntro();$('#intro').hidden=false;}
function renderIntro(){const pg=INTRO[introPage];$('#intro-dots').innerHTML=INTRO.map((_,i)=>`<i class="${i===introPage?'on':''}" data-act="introGo" data-n="${i}"></i>`).join('');$('#intro-e').textContent=pg.e;$('#intro-t').textContent=pg.t;$('#intro-body').innerHTML=pg.h;$('#intro-body').scrollTop=0;
  $('#intro-back').hidden=introPage===0;const last=introPage===INTRO.length-1;$('#intro-next').textContent=last?'🏁 Los geht’s':'Weiter ›';}
function closeIntro(){$('#intro').hidden=true;if(!S.introSeen){S.introSeen=true;save();}}
function openInfo(k){const i=INFO[k];if(!i)return;$('#info-title').textContent=i.t;$('#info-kurz').textContent=i.kurz;$('#info-body').innerHTML=i.lang;$('#info').hidden=false;$('#info-body').scrollTop=0;}
const infoBtn=k=>INFO[k]?`<button type="button" class="ci" data-act="info" data-k="${k}" title="Erklärung">ⓘ</button>`:'';

/* ---------- Aktionen ---------- */
function setSure(id){UI.sure=id;clearTimeout(UI.sureT);UI.sureT=setTimeout(()=>{if(UI.sure===id){UI.sure=null;render();if(!$('#modal').hidden)refreshModalFoot();}},4000);}
function refreshModalFoot(){if(!M)return;const id=M.id;const f=$('#m-foot');if(!f||!id)return;const b=f.querySelector('[data-act="mDelete"]');if(b)b.outerHTML=sure(id,'mDelete');}
function bump(kind,exId,delta,reps,minutes){const p=prof();let e=findEntry(p.id,UI.date,kind,exId);
  if(!e){if(delta<0)return;e={id:uid(),pid:p.id,date:UI.date,kind,exId,sets:0,reps:reps||'',minutes:minutes||'',note:'',created:Date.now()};S.log.push(e);}
  e.sets=Math.max(0,(+e.sets||0)+delta);if(!e.reps&&reps)e.reps=reps;if(kind==='dichte'&&minutes&&!e.minutes)e.minutes=minutes;
  if(e.sets===0&&!e.note){S.log=S.log.filter(x=>x!==e);}save();render();}
const ACT={
  go:el=>{UI.view=el.dataset.view;UI.sure=null;render();window.scrollTo(0,0);},
  home:()=>{UI.view='heute';UI.date=todayISO();UI.sure=null;render();window.scrollTo(0,0);},
  profile:el=>{S.active=el.dataset.id;save();render();},
  day:el=>{UI.date=el.dataset.iso;render();},
  week:el=>{UI.date=addDays(UI.date,+el.dataset.n);render();},
  today:()=>{UI.date=todayISO();render();},
  inc:el=>bump(el.dataset.kind,el.dataset.ex,1,+el.dataset.reps||'',+el.dataset.min||''),
  dec:el=>bump(el.dataset.kind,el.dataset.ex,-1),
  newEntry:el=>entryModal(null,el.dataset.today?todayISO():(el.dataset.nav&&UI.view!=='heute'?todayISO():UI.date)),
  editEntry:el=>entryModal(el.dataset.id),
  addTest:el=>testModal(null,el.dataset.ex),
  editTest:el=>testModal(el.dataset.id),
  addProfile:()=>profileModal(null),
  editProfile:el=>profileModal(el.dataset.id),
  delProfile:el=>{const id=el.dataset.id;if(UI.sure!==id){setSure(id);render();return;}if(S.profiles.length<2)return;S.profiles=S.profiles.filter(p=>p.id!==id);S.tests=S.tests.filter(t=>t.pid!==id);S.log=S.log.filter(l=>l.pid!==id);if(S.active===id)S.active=S.profiles[0].id;UI.sure=null;save();render();toast('Profil gelöscht');},
  addExercise:()=>exerciseModal(null),
  editExercise:el=>exerciseModal(el.dataset.id),
  export:()=>exportJSON(),
  import:()=>$('#importFile').click(),
  wipe:()=>{if(UI.sure!=='wipe'){setSure('wipe');render();return;}try{localStorage.removeItem(KEY);}catch(e){}S=defaults();UI.sure=null;save();render();toast('Alles gelöscht');},
  kindSel:el=>applyKind(el.dataset.k),
  info:el=>openInfo(el.dataset.k),
  infoClose:()=>{$('#info').hidden=true;},
  introOpen:()=>openIntro(0),
  introClose:()=>closeIntro(),
  introPrev:()=>{if(introPage>0){introPage--;renderIntro();}},
  introNext:()=>{if(introPage<INTRO.length-1){introPage++;renderIntro();}else{closeIntro();const p=prof();if(!S.tests.some(t=>t.pid===p.id)){UI.view='heute';render();testModal(null,p.push);}}},
  introGo:el=>{introPage=+el.dataset.n;renderIntro();},
  entInc:el=>{const l=S.log.find(x=>x.id===el.dataset.id);if(!l)return;l.sets=(+l.sets||0)+1;save();render();},
  entDec:el=>{const l=S.log.find(x=>x.id===el.dataset.id);if(!l)return;l.sets=Math.max(0,(+l.sets||0)-1);save();render();},
  blockOff:el=>{const p=prof();p.off=p.off||{};p.off[el.dataset.key]=true;save();render();toast('Aus dem Plan genommen – unten „wieder rein“ oder im Profil');},
  blockOn:el=>{const p=prof();if(p.off)delete p.off[el.dataset.key];save();render();toast('Wieder im Plan');},
  npStep:el=>npSet(el.dataset.id,(+val(el.dataset.id)||0)+(+el.dataset.d)),
  npPick:el=>npSet(el.dataset.id,+el.dataset.v),
  pickEx:el=>openPicker(el.dataset.target,el.dataset.filter,el.dataset.target.startsWith('f-')?($('#'+el.dataset.target)||{}).value:(el.dataset.target==='card:schock'?prof().schock:prof().dichte)),
  pkClose:()=>{$('#picker').hidden=true;},
  pkMuscle:el=>{PK.muscle=el.dataset.m;renderPicker();},
  pkSel:el=>pickDone(el.dataset.id),
  tStart:el=>timerStart(+el.dataset.min||15),
  tReset:el=>timerReset(+el.dataset.min||15),
  mClose:()=>closeModal(),
  mSave:()=>{if(!M)return;({entry:saveEntry,test:saveTest,profile:saveProfile,exercise:saveExercise,adjust:saveAdjust})[M.type]();},
  adjust:el=>adjustModal(el.dataset.ex),
  adjustReset:el=>{const p=prof();if(p.adj)delete p.adj[el.dataset.ex];save();closeModal();render();toast('Wieder der Vorschlag der App');},
  mDelete:el=>{if(!M||!M.id)return;const id=M.id;if(UI.sure!==id){setSure(id);refreshModalFoot();return;}
    if(M.type==='entry')S.log=S.log.filter(x=>x.id!==id);
    else if(M.type==='test')S.tests=S.tests.filter(x=>x.id!==id);
    else if(M.type==='exercise'){const usedBy=S.profiles.filter(p=>[p.push,p.pull,p.legs,p.dichte,p.schock].includes(id));if(usedBy.length){toast('Wird im Profil „'+usedBy[0].name+'“ benutzt – dort erst eine andere Übung wählen');UI.sure=null;refreshModalFoot();return;}S.exercises=S.exercises.filter(x=>x.id!==id);}
    UI.sure=null;save();closeModal();render();toast('Gelöscht');}
};
const CHG={
  blockEx:el=>{const p=prof();const kind=el.dataset.kind;const e=findEntry(p.id,UI.date,kind,null);if(e)e.exId=el.value;p[kind]=el.value;save();render();},
  testEx:el=>{const e=ex(el.value);if(!e||!$('#f-level'))return;const p=prof();const lvl=(latestTest(p.id,e.id)||{}).level||e.levels[Math.min(3,e.levels.length-1)];$('#f-level').innerHTML=e.levels.map(x=>`<option${x===lvl?' selected':''}>${esc(x)}</option>`).join('');},
  importFile:el=>{if(el.files&&el.files[0])importJSON(el.files[0]);el.value='';}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp="pkQ"]');if(el){PK.q=el.value.trim();renderPicker();}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const f=CHG[el.dataset.chg];if(f)f(el);});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==UI.view){UI.view=v;render();}});
window.METHODE={state:()=>S,ui:UI,render,dayPlan,numbers,cycle,openIntro};
render();
if(!S.introSeen)openIntro(0);
})();
</script>
</body>
</html>
